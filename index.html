<select onchange="F.m=this.value;gl()"><option value="">Semua mapel</option>${MP.map(m=>`<option ${F.m==m?'selected':''}>${m}</option>`).join('')}</select>
<div class="grid" id="gl">${cards()}</div><p><small>Dikembangkan oleh: Panca Siri Maulana,S.Pd.</small></p>`;
function pick(id){cfg.g=id;cfg.mp=GM()[0];cfg.tp=cfg.mp=='Matematika'?'Campuran':'';cfg.names=[];go('guru')}
const gen=()=>cfg.mp=='Matematika'&&['Campuran','Penjumlahan','Pengurangan','Perkalian','Pembagian'].includes(cfg.tp),qg=()=>cfg.g=='quest'||cfg.g=='jungle';
const GM=()=>cfg.g=='race'?['Matematika']:cfg.g=='mem'?Object.keys(PR):MP;
const pool=()=>BK.filter(b=>b[1]==cfg.mp&&b[0]<=cfg.k&&(!cfg.tp||b[2]==cfg.tp));
const tops=()=>{const bt=[...new Set(BK.filter(b=>b[1]==cfg.mp&&b[0]<=cfg.k).map(b=>b[2]))];return cfg.mp=='Matematika'?['Campuran','Penjumlahan','Pengurangan','Perkalian','Pembagian',...(cfg.g=='race'?[]:bt)]:['',...bt]};
const opt=(a,v)=>a.map(x=>`<option value="${x}" ${x==v?'selected':''}>${x||'Semua topik'}</option>`).join('');
const guru=()=>{const m=gen(),pl=qg()&&!m?pool().length:99,nq=Math.min(cfg.nq,pl),g=G.find(x=>x.id==cfg.g);
return`<div class="c"><h2>Persiapan Permainan</h2><p>${G.map(x=>`<button class="${x.id==cfg.g?'on':'g'}" onclick="cfg.g='${x.id}';cfg.mp=GM()[0];cfg.tp=cfg.mp=='Matematika'?'Campuran':'';draw()">${x.e} ${x.n}</button>`).join(' ')}</p>
<p>Kelas <select onchange="cfg.k=+this.value;cfg.tp=cfg.mp=='Matematika'?'Campuran':'';draw()">${opt([1,2,3,4,5,6],cfg.k)}</select>
Pemain <select onchange="cfg.np=+this.value;draw()">${opt([1,2,3,4,5,6],cfg.np)}</select>
Mapel <select onchange="cfg.mp=this.value;cfg.tp=this.value=='Matematika'?'Campuran':'';draw()">${opt(GM(),cfg.mp)}</select>
${cfg.g=='mem'?'':`Topik <select onchange="cfg.tp=this.value;draw()">${opt(tops(),cfg.tp)}</select> Jumlah soal <select onchange="cfg.nq=+this.value;draw()">${opt([5,10,15],cfg.nq)}</select>`}
Waktu <select onchange="cfg.tl=+this.value">${[[0,'Otomatis'],[-1,'Tanpa batas'],[60,'60 dtk'],[120,'120 dtk'],[180,'180 dtk']].map(([v,t])=>`<option value="${v}" ${cfg.tl==v?'selected':''}>${t}</option>`).join('')}</select> ${m&&cfg.g!='mem'?`Kesulitan <select onchange="cfg.lv=+this.value"><option value="0" ${cfg.lv==0?'selected':''}>Mudah</option><option value="1" ${cfg.lv==1?'selected':''}>Sedang</option><option value="2" ${cfg.lv==2?'selected':''}>Sulit</option></select>`:''}</p>
${qg()&&!m&&pl<cfg.nq?`<p style="color:var(--no)">${pl?`Soal tersedia hanya ${pl}; permainan memakai ${pl} soal tanpa pengulangan.`:'Belum ada soal untuk pilihan ini. Ubah kelas, mapel, atau topik.'}</p>`:''}
${!m&&cfg.g=='race'?'':''}<h3>Nama pemain</h3><p>${[...Array(cfg.np)].map((_,i)=>`<input placeholder="Pemain ${i+1}" value="${esc(cfg.names[i]||'')}" maxlength="14" oninput="cfg.names[${i}]=this.value" style="border-color:${C[i]}">`).join(' ')}</p>
<p><small>Ringkasan: ${g.n} • Kelas ${cfg.k} • ${cfg.mp}${cfg.g!='mem'&&cfg.tp?' — '+cfg.tp:''} • ${cfg.np} pemain • ${cfg.g=='mem'?'6 pasangan':nq+' soal'}${m&&cfg.g!='mem'?' • '+['Mudah','Sedang','Sulit'][cfg.lv]:''}</small></p>
<button ${nq?'':'disabled'} onclick="start()">▶ MULAI BERMAIN</button></div>`};
function gq(k,t,lv){const f=[.6,1,1.6][lv],x=Math.round((k*8+8)*f);let a,b,q,r;if(!t||t=='Campuran')t=['Penjumlahan','Pengurangan','Perkalian','Pembagian'][rnd(k<3?2:k<4?3:4)];
if(t=='Penjumlahan'){a=1+rnd(x);b=1+rnd(x);q=a+' + '+b;r=a+b}
else if(t=='Pengurangan'){a=3+rnd(x);b=1+rnd(a-2);q=a+' − '+b;r=a-b}
else if(t=='Perkalian'){const y=Math.round((k<4?6:9)*f)+2;a=2+rnd(y);b=2+rnd(y);q=a+' × '+b;r=a*b}
else{b=2+rnd(Math.round(6*f)+2);r=1+rnd(Math.round((k+4)*f)+2);a=b*r;q=a+' ÷ '+b}
const s=new Set([r]);while(s.size<3){const d=r+(rnd(7)-3)*(r>20?2:1);if(d>=0)s.add(d)}
return{q,r,o:shuf([...s])}}
function start(){const u={},m=gen();const nm=[...Array(cfg.np)].map((_,i)=>{let n=(cfg.names[i]||'').trim()||'Pemain '+(i+1);u[n]=(u[n]||0)+1;return u[n]>1?n+' '+u[n]:n});
let nq=cfg.nq,pl=null;if(qg()&&!m){pl=pool();nq=Math.min(nq,pl.length)}if(cfg.g=='mem')nq=6;const qn=cfg.g=='jungle'?nq*2:nq;
Object.assign(cfg,{nq,el:0,pause:0,rank:0,left:cfg.tl>0?cfg.tl:cfg.tl<0?1e9:(cfg.g=='race'?nq*12:cfg.g=='mem'?150:nq*15)});
P=nm.map((n,i)=>{const p={n,i,pos:0,ben:0,sal:0,lock:0,fin:0,fb:null,ph:0,risk:0,qi:0};
if(cfg.g=='race')p.q=gq(cfg.k,cfg.tp,cfg.lv);
else if(qg())p.qs=m?[...Array(qn)].map(()=>{const q=gq(cfg.k,cfg.tp,cfg.lv);return{t:q.q+' = ?',o:q.o.map(x=>[x,x==q.r])}}):shuf(pl).slice(0,qn).map(b=>({t:b[3],o:shuf([[b[4],1],[b[5],0],[b[6],0]])}));
else{p.cards=shuf(shuf(PR[cfg.mp]).slice(0,6).flatMap(([e,w],i)=>[{i,t:e,s:0},{i,t:w,s:0}]));p.sel=[]}
return p});
V='play';T=setInterval(()=>{if(cfg.pause)return;cfg.el++;if(--cfg.left<=0)return end();tm()},1000);draw()}
const tm=()=>{const e=$('#tm');if(e)e.textContent=(cfg.left>1e8?'⏱ '+cfg.el+' dtk':'⏱ sisa '+cfg.left+' dtk')};
const body=p=>{const g=cfg.g;let h=`<div class="ah"><b>${p.i+1}. ${esc(p.n)}</b><span>⭐ ${p.ben*10}</span></div>`;
if(p.fin)return h+`<div class="fn"><div style="font-size:44px">🎉</div><h2>Selesai ke-${p.fin}</h2><p>Benar ${p.ben} • Salah ${p.sal}</p></div>`;
if(g=='race')return h+`<div class="trk"><span style="left:${p.pos/cfg.nq*84}%">🏎️</span><i>🏁</i></div><h2>${p.q.q} = ?</h2><div class="op">${p.q.o.map(x=>`<button ${p.lock?'disabled':''} onpointerdown="ans(${p.i},${x})">${x}</button>`).join('')}</div>${p.lock?'<small>Salah. Tunggu sebentar…</small>':''}`;
if(g=='jungle'){const q=p.qs[p.qi];return h+`<div class="trk"><span style="left:${Math.min(p.pos/cfg.nq,1)*84}%">🐒</span><i>🏝️</i></div><small>Bintang: ${'⭐'.repeat(p.ben)||'—'}</small>`+(p.ph==0?`<h3>Pilih jalur</h3><div class="op v"><button onpointerdown="jp(${p.i},0)">🌉 Jembatan aman (+1)</button><button onpointerdown="jp(${p.i},1)">🌴 Jalan pintas (+2, salah −1)</button></div>`:`<h3>${esc(q.t)}</h3><div class="op v">${q.o.map((o,j)=>`<button style="${p.fb!=null?(o[1]?'background:var(--ok)':p.fb==j?'background:var(--no)':''):''}" ${p.fb!=null?'disabled':''} onpointerdown="ja(${p.i},${j})">${esc(o[0])}</button>`).join('')}</div>`)}
if(g=='quest'){const q=p.qs[p.pos];return h+`<div class="trk"><span style="left:${p.pos/cfg.nq*84}%">🧭</span><i>💎</i></div><small>Peti terbuka: ${'💰'.repeat(p.ben)||'—'}</small><h3>${esc(q.t)}</h3><div class="op v">${q.o.map((o,j)=>`<button style="${p.fb!=null?(o[1]?'background:var(--ok)':p.fb==j?'background:var(--no)':''):''}" ${p.fb!=null?'disabled':''} onpointerdown="qa(${p.i},${j})">${esc(o[0])}</button>`).join('')}</div>`}
return h+`<div class="mg">${p.cards.map((c,j)=>`<button class="cd ${c.s?'g':''}" ${c.s==2?'disabled':''} onpointerdown="flip(${p.i},${j})">${c.s?c.t:'❓'}</button>`).join('')}</div>`};
const pp=i=>{if(cfg.pause||V!='play')return;const e=$('#ar'+i);if(e)e.innerHTML=body(P[i])};
function paint(){const g=G.find(x=>x.id==cfg.g);
A.innerHTML=`<div class="hd"><b>${g.e} ${g.n}</b><span id="tm"></span><button class="g" onclick="cfg.pause=1;paint()">⏸ Jeda</button><button class="g" onclick="end()">✔ Selesaikan Sesi</button><button class="g" onclick="go('home')">✖ Batalkan</button></div>`+(cfg.pause?`<div class="c"><h2>Permainan dijeda</h2><button onclick="cfg.pause=0;paint()">▶ Lanjutkan</button></div>`:`<div class="ar" style="--cols:${[1,2,3,2,3,3][P.length-1]}">${P.map(p=>`<div class="pn" id="ar${p.i}" style="--c:${C[p.i]}">${body(p)}</div>`).join('')}</div>`);tm()}
function jp(i,r){const p=P[i];if(cfg.pause||p.ph||p.fin||V!='play')return;p.risk=r;p.ph=1;pp(i)}
function ja(i,j){const p=P[i];if(cfg.pause||p.fb!=null||!p.ph||p.fin||V!='play')return;p.fb=j;
if(p.qs[p.qi].o[j][1]){p.ben++;p.pos+=p.risk?2:1}else{p.sal++;if(p.risk)p.pos=Math.max(0,p.pos-1)}pp(i);
setTimeout(()=>{if(V!='play')return;p.fb=null;p.ph=0;p.qi++;if(p.pos>=cfg.nq||p.qi>=p.qs.length)fin(p);pp(i);ce()},750)}
function fin(p){p.fin=++cfg.rank;p.d=cfg.el}
const ce=()=>{if(P.every(p=>p.fin))end()};
function ans(i,x){const p=P[i];if(cfg.pause||p.lock||p.fin||V!='play')return;
if(x==p.q.r){p.ben++;p.pos++;if(p.pos>=cfg.nq)fin(p);else p.q=gq(cfg.k,cfg.tp,cfg.lv)}
else{p.sal++;p.lock=1;setTimeout(()=>{p.lock=0;pp(i)},1200)}
pp(i);ce()}
function qa(i,j){const p=P[i];if(cfg.pause||p.fb!=null||p.fin||V!='play')return;p.fb=j;p.qs[p.pos].o[j][1]?p.ben++:p.sal++;pp(i);
setTimeout(()=>{if(V!='play')return;p.fb=null;p.pos++;if(p.pos>=cfg.nq)fin(p);pp(i);ce()},750)}
function flip(i,j){const p=P[i],c=p.cards[j];if(cfg.pause||p.fin||p.busy||c.s||V!='play')return;c.s=1;p.sel.push(j);
if(p.sel.length==2){const[a,b]=p.sel.map(x=>p.cards[x]);
if(a.i==b.i){a.s=b.s=2;p.ben++;p.sel=[];if(p.cards.every(c=>c.s==2))fin(p)}
else{p.sal++;p.busy=1;setTimeout(()=>{a.s=b.s=0;p.sel=[];p.busy=0;pp(i)},800)}}
pp(i);ce()}
function end(){if(V!='play')return;clearInterval(T);T=null;S.ses++;const g=G.find(x=>x.id==cfg.g),m=cfg.mp+(cfg.g!='mem'&&cfg.tp&&cfg.tp!='Campuran'?' · '+cfg.tp:'');
const L=P.map(p=>({p,sc:p.ben*10+(p.fin?[30,20,10,5,3,2][p.fin-1]:0),d:p.d||cfg.el})).sort((a,b)=>b.sc-a.sc||a.d-b.d);
cfg.sess=L.map(({p,sc,d},x)=>{const n=p.ben+p.sal;return{name:p.n,k:cfg.k,game:g.n,m,ses:S.ses,nq:cfg.nq,skor:sc,ben:p.ben,sal:p.sal,pct:n?Math.round(p.ben/n*100):null,dur:d,rk:x+1,w:new Date().toLocaleString('id-ID')}});
cfg.sess.forEach(r=>{r.no=S.rec.length+1;S.rec.push(r)});save();V='sum';draw()}
const H=['No','Nama','Kelas','Game','Mapel/Topik','Sesi','Soal','Skor','Benar','Salah','Persen','Durasi','Peringkat','Waktu'];
const row=r=>[r.no,esc(r.name),r.k,r.game,esc(r.m),r.ses,r.nq??'—',r.skor,r.ben,r.sal,r.pct==null?'—':r.pct+'%',r.dur+' dtk',r.rk??'—',r.w];
const tbl=L=>`<div class="sc"><table><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr>${L.map(r=>`<tr>${row(r).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const sum=()=>`<div class="c"><h2>Ringkasan sesi ke-${S.ses}</h2>${tbl(cfg.sess.slice().sort((a,b)=>b.skor-a.skor))}<p><button onclick="cfg.names=[];go('guru')">▶ Sesi Berikutnya</button> <button class="g" onclick="go('rekap')">📊 Lihat Rekap</button></p></div>`;
const rows=()=>S.rec.filter(r=>(!R.g||r.game==R.g)&&r.name.toLowerCase().includes(R.q.toLowerCase())).sort((a,b)=>R.d?b.skor-a.skor:a.no-b.no);
const rt=()=>{const L=rows();$('#rt').innerHTML=L.length?tbl(L):'<p>Belum ada data. Mainkan sesi dari Persiapan.</p>'};
const gopt=v=>G.map(x=>`<option ${v==x.n?'selected':''}>${x.n}</option>`).join('');
const rekap=()=>`<div class="c"><h2>Rekap keseluruhan: ${S.rec.length} data dari ${S.ses} sesi</h2>
<p><input placeholder="Cari nama" value="${esc(R.q)}" oninput="R.q=this.value;rt()"> <select onchange="R.g=this.value;rt()"><option value="">Semua game</option>${gopt(R.g)}</select> <button class="g" onclick="R.d=!R.d;rt()">↕ Urutkan skor</button></p>
<div id="rt">${rows().length?tbl(rows()):'<p>Belum ada data. Mainkan sesi dari Persiapan.</p>'}</div>
<p><button onclick="csv()">📋 Salin CSV</button> <button class="g" onclick="try{window.print()}catch(e){}">🖨️ Cetak</button> <button class="g" onclick="R.c=1;draw()">🏁 Akhiri Sesi</button></p>
<div id="cx"></div>${R.c?`<div class="c" style="border-color:var(--no)"><h3>Akhiri sesi dan hapus semua data?</h3><p>Salin CSV dulu jika hasilnya masih dibutuhkan. Data yang dihapus tidak bisa dikembalikan.</p><button class="g" onclick="csv()">📋 Salin CSV dulu</button> <button style="background:var(--no)" onclick="S.rec=[];S.ses=0;R.c=0;save();draw()">Ya, hapus data</button> <button class="g" onclick="R.c=0;draw()">Batal</button></div>`:''}</div>`;
function csv(){const L=rows();if(!L.length){$('#cx').innerHTML='<p>Belum ada data untuk disalin.</p>';return}
const t=[H,...L.map(r=>row(r).map(x=>String(x).replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')))].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
$('#cx').innerHTML='<p>Teks CSV (tempel ke Excel atau Notepad lalu simpan sebagai .csv):</p><textarea id="ct" rows="5" style="width:100%"></textarea>';const e=$('#ct');e.value=t;e.select();try{navigator.clipboard.writeText(t)}catch(x){}}
const rank=()=>{const m={};S.rec.filter(r=>!R.rg||r.game==R.rg).forEach(r=>{(m[r.name]=m[r.name]||{n:r.name,s:0,c:0}).s+=r.skor;m[r.name].c++});const L=Object.values(m).sort((a,b)=>b.s-a.s).slice(0,10);
return`<div class="c"><h2>🏆 Peringkat sesi ini</h2><p><select onchange="R.rg=this.value;draw()"><option value="">Semua game</option>${gopt(R.rg)}</select></p>${L.length?`<ol>${L.map((x,i)=>`<li>${['🥇','🥈','🥉'][i]||''} <b>${esc(x.n)}</b>: ${x.s} poin (${x.c}× main)</li>`).join('')}</ol>`:'<p>Belum ada data peringkat.</p>'}<small>Peringkat hanya dari data di tab ini, bukan peringkat global.</small></div>`};
const pref=()=>`<div class="c"><h2>Pengaturan</h2><p>Data sesi disimpan sementara di tab ini. Jika tab atau browser ditutup, rekap dapat hilang dan tidak bisa dilihat dari perangkat lain.</p><p>Bank soal (selain operasi hitung Matematika) masih berupa contoh awal dan perlu dilengkapi serta diperiksa guru sebelum dipakai sebagai penilaian resmi.</p></div>`;
draw();
</script></body></html>
